<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Team — CoolTeam</title>
    <meta name="robots" content="noindex" />

    <link
      rel="shortcut icon"
      href="assets/icons/favicon.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/app-shell.css" />
    <link rel="stylesheet" href="css/app-components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script src="js/components.js" defer></script>
    <script type="module" src="js/team.js"></script>
  </head>
  <body class="app-page" data-page="team">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app" id="app">
      <div data-app="sidebar"></div>
      <div class="app__main">
        <div data-app="topbar" data-eyebrow="Workspace" data-title="Team"></div>
        <main class="app__content" id="main">
          <p class="sr-only" id="status" role="status" aria-live="polite"></p>

          <div class="page-intro">
            <p class="page-intro__text">
              Manage people, responsibilities, and their level of access.
            </p>
            <button
              class="btn btn--primary btn--md"
              type="button"
              id="invite-open"
            >
              <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-mail-plus"></use></svg
              >Invite member
            </button>
          </div>

          <div class="toolbar">
            <div class="searchbar">
              <svg class="icon" aria-hidden="true" focusable="false">
                <use href="#i-search"></use>
              </svg>
              <input
                id="search"
                type="search"
                placeholder="Search members"
                aria-label="Search members"
                autocomplete="off"
              />
            </div>
          </div>

          <div class="table-wrap">
            <table class="table">
              <caption class="sr-only">
                Workspace members
              </caption>
              <thead>
                <tr>
                  <th scope="col">Member</th>
                  <th scope="col">Role</th>
                  <th scope="col">Projects</th>
                  <th scope="col">Status</th>
                  <th scope="col" class="align-end">
                    <span class="sr-only">Actions</span>
                  </th>
                </tr>
              </thead>
              <tbody id="team-body"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <dialog class="modal" id="invite-modal" aria-labelledby="invite-title">
      <div class="modal__head">
        <h2 class="modal__title" id="invite-title">Invite a member</h2>
        <button
          class="modal__close"
          type="button"
          data-close
          aria-label="Close"
        >
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="#i-x"></use>
          </svg>
        </button>
      </div>
      <form id="invite-form" novalidate>
        <div class="form-alert" role="alert" hidden>
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="#i-alert-circle"></use></svg
          ><span></span>
        </div>
        <div class="field">
          <label class="field__label" for="invite-email">Email address</label>
          <input
            class="field__input"
            id="invite-email"
            type="email"
            inputmode="email"
            placeholder="teammate@studio.com"
            autocomplete="off"
            aria-describedby="invite-email-error"
          />
          <p class="field__error" id="invite-email-error" hidden>
            <svg class="icon" aria-hidden="true" focusable="false">
              <use href="#i-alert-circle"></use></svg
            ><span></span>
          </p>
        </div>
        <div class="field">
          <label class="field__label" for="invite-role">Role</label>
          <select class="field__input" id="invite-role">
            <option>Member</option>
            <option>Project Manager</option>
            <option>Admin</option>
            <option>Guest</option>
          </select>
        </div>
        <button
          class="btn btn--primary btn--block btn--md"
          type="submit"
          id="invite-submit"
        >
          Send invite
        </button>
      </form>
    </dialog>
  </body>
</html>

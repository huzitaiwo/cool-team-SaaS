<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billing — CoolTeam</title>
    <meta name="robots" content="noindex" />

    <link
      rel="shortcut icon"
      href="assets/icons/favicon.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/app-shell.css" />
    <link rel="stylesheet" href="css/app-components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script src="js/components.js" defer></script>
    <script type="module" src="js/billing.js"></script>
  </head>
  <body class="app-page" data-page="billing">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app" id="app">
      <div data-app="sidebar"></div>
      <div class="app__main">
        <div
          data-app="topbar"
          data-eyebrow="Workspace"
          data-title="Billing"
        ></div>
        <main class="app__content" id="main">
          <p class="sr-only" id="status" role="status" aria-live="polite"></p>

          <div class="page-intro">
            <p class="page-intro__text">
              A clear view of what your workspace uses today, and the choices
              for what comes next.
            </p>
            <div
              class="segmented"
              role="radiogroup"
              aria-label="Preview billing state"
            >
              <span class="segmented__label" aria-hidden="true">State</span>
              <label
                ><input type="radio" name="mode" value="live" checked /><span
                  >Live</span
                ></label
              >
              <label
                ><input type="radio" name="mode" value="demo" /><span
                  >Demo</span
                ></label
              >
              <label
                ><input type="radio" name="mode" value="pastdue" /><span
                  >Past due</span
                ></label
              >
              <label
                ><input type="radio" name="mode" value="loading" /><span
                  >Loading</span
                ></label
              >
              <label
                ><input type="radio" name="mode" value="error" /><span
                  >Error</span
                ></label
              >
            </div>
          </div>

          <div id="billing-root"></div>
        </main>
      </div>
    </div>

    <dialog class="modal" id="cancel-modal" aria-labelledby="cancel-title">
      <div class="modal__head">
        <h2 class="modal__title" id="cancel-title">Cancel your plan?</h2>
        <button
          class="modal__close"
          type="button"
          data-close
          aria-label="Close"
        >
          <svg class="icon" aria-hidden="true" focusable="false">
            <use href="#i-x"></use>
          </svg>
        </button>
      </div>
      <form id="cancel-form">
        <p class="modal__text" id="cancel-text"></p>
        <div class="field">
          <label class="field__label" for="cancel-reason"
            >What’s the main reason?</label
          >
          <select class="field__input" id="cancel-reason" required>
            <option value="" disabled selected>Choose a reason</option>
            <option>It’s too expensive</option>
            <option>It’s missing features we need</option>
            <option>We’re switching tools</option>
            <option>Our project has finished</option>
            <option>Something else</option>
          </select>
        </div>
        <div class="field">
          <label class="field__label" for="cancel-note"
            >Anything we should know?
            <span style="font-weight: 400; color: var(--color-muted)"
              >(optional)</span
            ></label
          >
          <textarea
            class="field__input"
            id="cancel-note"
            rows="3"
            maxlength="400"
            style="height: auto; padding-top: 0.75rem"
          ></textarea>
        </div>
        <div class="modal__actions" style="margin-top: 0.25rem">
          <button class="btn btn--outline btn--md" type="button" data-close>
            Keep my plan
          </button>
          <button
            class="btn btn--danger btn--md"
            type="submit"
            id="cancel-submit"
            disabled
          >
            Cancel plan
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>

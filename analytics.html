<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analytics — CoolTeam</title>
    <meta name="robots" content="noindex" />

    <link
      rel="shortcut icon"
      href="assets/icons/favicon.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/app-shell.css" />
    <link rel="stylesheet" href="css/app-components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script src="js/components.js" defer></script>
    <script type="module" src="js/analytics.js"></script>
  </head>
  <body class="app-page" data-page="analytics">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app" id="app">
      <div data-app="sidebar"></div>
      <div class="app__main">
        <div
          data-app="topbar"
          data-eyebrow="Workspace"
          data-title="Analytics"
        ></div>
        <main class="app__content" id="main">
          <p class="sr-only" id="status" role="status" aria-live="polite"></p>

          <div class="page-intro">
            <p class="page-intro__text">
              A practical read on the work moving through your workspace.
            </p>
            <label class="sr-only" for="range">Date range</label>
            <select class="select select--inline" id="range">
              <option value="7">7 days</option>
              <option value="30" selected>30 days</option>
              <option value="90">90 days</option>
            </select>
          </div>

          <section class="stats" id="stats" aria-label="Key metrics"></section>

          <div class="analytics-grid">
            <section class="panel" aria-labelledby="chart-title">
              <div class="panel__head">
                <div>
                  <h2 class="panel__title" id="chart-title">Tasks completed</h2>
                  <p class="panel__sub" id="chart-sub"></p>
                </div>
                <span class="panel__icon" aria-hidden="true"
                  ><svg class="icon" focusable="false">
                    <use href="#i-bar-chart"></use></svg
                ></span>
              </div>
              <figure class="chart-fig">
                <div class="chart" id="chart" role="img"></div>
                <figcaption class="sr-only" id="chart-caption"></figcaption>
                <table class="sr-only" id="chart-table"></table>
              </figure>
            </section>

            <section class="panel" aria-labelledby="health-title">
              <div class="panel__head">
                <h2 class="panel__title" id="health-title">Project health</h2>
              </div>
              <div class="health-list" id="health"></div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>

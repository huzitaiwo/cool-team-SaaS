<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notifications — CoolTeam</title>
    <meta name="robots" content="noindex" />

    <link
      rel="shortcut icon"
      href="assets/icons/favicon.png"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/app-shell.css" />
    <link rel="stylesheet" href="css/app-components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <script src="js/components.js" defer></script>
    <script type="module" src="js/notifications.js"></script>
  </head>
  <body class="app-page" data-page="notifications">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app" id="app">
      <div data-app="sidebar"></div>
      <div class="app__main">
        <div
          data-app="topbar"
          data-eyebrow="Workspace"
          data-title="Notifications"
        ></div>
        <main class="app__content" id="main">
          <p class="sr-only" id="status" role="status" aria-live="polite"></p>

          <div class="page-intro">
            <p class="page-intro__text">
              The updates that deserve your attention, without the noise.
            </p>
            <button
              class="link-arrow"
              type="button"
              id="mark-all"
              style="font-size: 0.92rem"
            >
              Mark all read
            </button>
          </div>

          <div class="stack">
            <section
              class="panel panel--flush"
              aria-label="Recent notifications"
            >
              <ul id="notif-list"></ul>
            </section>

            <section class="panel" aria-labelledby="prefs-title">
              <div class="panel__head">
                <div>
                  <h2 class="panel__title" id="prefs-title">
                    Notification preferences
                  </h2>
                  <p class="panel__sub">
                    Choose where this workspace can get your attention.
                  </p>
                </div>
              </div>
              <div class="notif-prefs" id="prefs"></div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
